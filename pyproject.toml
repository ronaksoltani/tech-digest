[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-tech-digest"
version = "1.0.0"
description = "Render and optionally email a keyword-ranked RSS digest"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ronak Soltani"}]
dependencies = ["feedparser>=6.0", "requests>=2.31", "jinja2>=3.1", "python-dotenv>=1.0"]

[project.scripts]
tech-digest = "tech_digest.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tech_digest = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
